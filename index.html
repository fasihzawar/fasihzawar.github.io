<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Portfolio — Unity Mobile Games</title>
<meta name="description" content="Unity mobile games shipped on Google Play: Nova Siege, Rotate Loops, Obby Escape, HoleX, Hungry Hole, Pirate Cannon Blast, Cryptogram, AFK Fortress, Kitty Painter and Nova Siege.">
<style>
  :root { --bg:#0d0f17; --card:#161a26; --line:#262b3b; --text:#e8eaf2; --muted:#9aa0b4; --accent:#7c5cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; }
  .wrap { max-width:1150px; margin:0 auto; padding:0 20px; }
  header { padding:96px 0 56px; background:radial-gradient(900px 400px at 20% 0%, #2a1f5c 0%, transparent 70%); }
  header h1 { font-size:clamp(2.2rem,5vw,3.6rem); line-height:1.1; margin:0 0 16px; letter-spacing:-.02em; }
  header p { color:var(--muted); font-size:1.15rem; max-width:640px; margin:0 0 28px; }
  .stats { display:flex; gap:32px; flex-wrap:wrap; }
  .stats b { display:block; font-size:1.8rem; }
  .stats span { color:var(--muted); font-size:.9rem; }
  nav { position:sticky; top:0; z-index:5; background:rgba(13,15,23,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  nav .wrap { display:flex; gap:6px; overflow-x:auto; padding:10px 20px; }
  nav a { text-decoration:none; color:var(--muted); padding:6px 12px; border-radius:999px; white-space:nowrap; font-size:.92rem; }
  nav a:hover { color:var(--text); background:var(--card); }
  section.game { padding:56px 0; border-bottom:1px solid var(--line); scroll-margin-top:56px; }
  .head { display:flex; gap:18px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
  .head img { width:72px; height:72px; border-radius:18px; object-fit:cover; background:var(--card); }
  .head h2 { margin:0; font-size:1.7rem; }
  .head p { margin:2px 0 0; color:var(--muted); }
  .head .meta { flex:1; min-width:220px; }
  .tags { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tag { font-size:.8rem; padding:3px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--muted); }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .btn:hover { filter:brightness(1.1); }
  .strip { display:flex; gap:12px; overflow-x:auto; padding-bottom:12px; scroll-snap-type:x proximity; }
  .strip img { height:340px; width:auto; border-radius:12px; cursor:zoom-in; scroll-snap-align:start; background:var(--card); flex:none; }
  video { width:100%; border-radius:14px; margin-bottom:16px; background:#000; display:block; }
  footer { padding:48px 0 64px; color:var(--muted); text-align:center; }
  dialog { border:0; padding:0; background:transparent; max-width:95vw; max-height:95vh; }
  dialog::backdrop { background:rgba(0,0,0,.88); }
  dialog img { max-width:95vw; max-height:92vh; display:block; border-radius:10px; }
  @media (max-width:640px) { .strip img { height:240px; } header { padding:64px 0 40px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Unity Game Developer</h1>
    <p>Mobile games built in Unity and shipped on Google Play — obby parkour, hyper-casual, puzzle, physics and tower defense.</p>
    <div class="stats">
      <div><b>8</b><span>Live on Google Play</span></div>
      <div><b>1.1M+</b><span>Total downloads</span></div>
    </div>
    <p style="margin:32px 0 0"><a class="btn" href="mailto:fasihzawar7@gmail.com">✉ Contact me</a></p>
  </div>
</header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="games"></main>
<footer>
  <a href="mailto:fasihzawar7@gmail.com">fasihzawar7@gmail.com</a> · <a href="https://github.com/fasihzawar">github.com/fasihzawar</a>
</footer>
<dialog id="lb" onclick="this.close()"><img alt=""></dialog>
<script>
const play = id => `https://play.google.com/store/apps/details?id=${id}`;
// ponytail: game list lives here; add a game = add one object + an img/<slug>/ folder
const games = [
  { slug:"nova-siege", name:"Nova Siege", shots:11, genre:"Tower Defense", video:"nova-siege.mp4",
    desc:"A mobile tower defense game where everything is a card — 72 towers, rarities and grades, hundreds of units and homing projectiles, running at 60 FPS on mobile." },
  { slug:"rotate-loops", name:"Rotate Loops", pkg:"com.qas.gf.rotate.loops.game", shots:8, dl:"5K+", genre:"Puzzle",
    desc:"Rotate rings, align gaps, untangle loops and solve relaxing puzzles." },
  { slug:"obby-escape", name:"Obby Escape: Story Games", pkg:"com.prison.escape.obby.parkour.game3d", shots:5, dl:"1M+", genre:"Obby Parkour",
    desc:"Escape Prison, School, Carnival & more in fun Obby Parkour story adventures." },
  { slug:"holex", name:"HoleX", pkg:"com.qas.gi.holex.game", shots:4, dl:"100K+", genre:"Puzzle",
    desc:"Control the black hole, eat everything, and clear every level fast." },
  { slug:"hungry-hole", name:"Hungry Hole: Eat All", pkg:"com.gi.hungry.hole.eat.all.game", shots:5, dl:"10K+", genre:"Puzzle",
    desc:"Control a hungry hole, eat everything, grow bigger, and complete fun levels." },
  { slug:"pirate-cannon", name:"Pirate Cannon Blast", pkg:"com.qas.gf.pirate.cannon.blast.game", shots:5, dl:"10K+", genre:"Physics",
    desc:"Aim, fire, and blast pirate forts in an exciting physics destruction adventure." },
  { slug:"afk-fortress", name:"AFK Fortress", pkg:"com.castellancode.AFKFortress", shots:9, dl:"1K+", genre:"Idle Tower Defense",
    desc:"Evolve your army from Ice Age to Alien Age in this idle tower defense." },
  { slug:"cryptogram", name:"Cryptogram: Word Logic Game", pkg:"com.dzu.cryptogram.word.logic.game", shots:6, dl:"1K+", genre:"Word Puzzle",
    desc:"Decode quotes, solve word puzzles, and train your brain every day." },
  { slug:"kitty-painter", name:"Kitty Painter: Logic Puzzle", pkg:"com.qas.gf.kitty.painter.game", shots:4, genre:"Logic Puzzle",
    desc:"Solve relaxing logic puzzles, paint pixel art, and create with your cute kitty." },
];
const pad = n => String(n).padStart(2, "0");
document.getElementById("nav").innerHTML = games.map(g => `<a href="#${g.slug}">${g.name.split(":")[0]}</a>`).join("");
document.getElementById("games").innerHTML = games.map(g => `
  <section class="game" id="${g.slug}">
    <div class="head">
      <img src="img/${g.slug}/${g.pkg ? "icon.png" : "poster.jpg"}" alt="${g.name} icon">
      <div class="meta">
        <h2>${g.name}</h2>
        <p>${g.desc}</p>
        <div class="tags"><span class="tag">${g.genre}</span><span class="tag">Unity</span>${g.dl ? `<span class="tag">${g.dl} downloads</span>` : ""}</div>
      </div>
      ${g.pkg ? `<a class="btn" href="${play(g.pkg)}" target="_blank" rel="noopener">▶ Google Play</a>` : ""}
    </div>
    ${g.video ? `<video src="${g.video}" poster="img/${g.slug}/poster.jpg" controls preload="none" playsinline></video>` : ""}
    <div class="strip">${Array.from({length:g.shots}, (_, i) =>
      `<img src="img/${g.slug}/${pad(i + 1)}.jpg" alt="${g.name} screenshot ${i + 1}" loading="lazy">`).join("")}</div>
  </section>`).join("");
const lb = document.getElementById("lb");
document.addEventListener("click", e => {
  if (e.target.matches(".strip img")) { lb.querySelector("img").src = e.target.src; lb.showModal(); }
});
</script>
</body>
</html>
